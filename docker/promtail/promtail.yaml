server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: ".*app.*"
        target_label: "service"
        replacement: "app"
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  trace_id: trace_id
                  span_id: span_id
            - labels:
                level:
                event:
            - structured_metadata:
                trace_id:
                span_id:
